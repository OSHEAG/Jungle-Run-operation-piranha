<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a759f">
    <title>Jungle Run: Multiplayer Elite</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono-192.png">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="canvasJuego"></canvas>
    <script src="script.js"></script>
    <script>
        // Registro del Service Worker para funcionamiento Offline y App
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(err => console.log('Error SW', err));
            });
        }
    </script>
</body>
</html>
